name: LinkedIn Analytics

# Free replacement for the n8n "03 Analytics Collector" workflow: daily at
# 08:00 UTC, read likes and comments for published posts and store them.
#
# Repository settings -> Secrets and variables -> Actions -> Secrets:
#   ANALYTICS_WEBHOOK_SECRET  (same value as in Vercel)
#   LINKEDIN_ACCESS_TOKEN     (same token as the publisher)

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect engagement
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/linkedin-analytics.ts
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://linkedin-ai-studio-alpha.vercel.app' }}
          ANALYTICS_WEBHOOK_SECRET: ${{ secrets.ANALYTICS_WEBHOOK_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
