name: LinkedIn Publisher

# Free replacement for the n8n "02 Publisher Scheduler" workflow: every 15
# minutes, publish the approved posts that are due and report back to the app.
#
# Repository settings -> Secrets and variables -> Actions -> Secrets:
#   SCHEDULER_WEBHOOK_SECRET  (same value as in Vercel)
#   LINKEDIN_ACCESS_TOKEN     (scopes: openid profile w_member_social; expires after ~60 days)
#   LINKEDIN_PERSON_URN       (optional, urn:li:person:...)
# GitHub may start scheduled runs a few minutes late.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkedin-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish due posts
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/linkedin-publisher.ts
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://linkedin-ai-studio-alpha.vercel.app' }}
          SCHEDULER_WEBHOOK_SECRET: ${{ secrets.SCHEDULER_WEBHOOK_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
